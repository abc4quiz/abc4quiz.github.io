<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LNBHS VISIBLE STAND</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:4px;background:#222;text-align:center;font-family:Arial}
#screen{width:98%;height:64px;background:#fff;color:#000;border:3px solid #ffb400;border-radius:12px;font-weight:bold;font-size:18px}
.box{max-width:360px;margin:8px auto}
.row{display:flex;gap:4px}
.k{flex:1;height:46px;background:#555;border:3px solid #fff;border-radius:10px;color:#fff;font-weight:bold;font-size:15px}
.c{flex:1;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 6px #000}
.ctrl{flex:1;height:46px;background:#eee;border:3px solid #fff;border-radius:10px;color:#000;font-weight:bold;font-size:22px}
.gap{height:16px;background:#111;border:1px dashed #555;border-radius:6px;margin:2px 0} /* NOW VISIBLE STAND */
.c1{background:#ff0000}.c2{background:#ff4400}.c3{background:#ff8800}.c4{background:#ffbb00}.c5{background:#ffee00}
.c6{background:#aaff00}.c7{background:#00ff00}.c8{background:#00ff88}.c9{background:#00ffcc}
.c10{background:#00ddff}.c11{background:#0099ff}.c12{background:#3355ff}.c13{background:#7744ff}.c14{background:#aa00ff}
.c15{background:#ff00ff}.c16{background:#ff1493}.c17{background:#ff4500}.c18{background:#ffffff}
</style>
</head>
<body>
<textarea id="screen" placeholder="LNBHS Track Typing"></textarea>
<div class="box">
<div class="row">
<button class="k" onclick="T('1')">1</button><button class="k" onclick="T('2')">2</button><button class="k" onclick="T('3')">3</button><button class="k" onclick="T('4')">4</button><button class="k" onclick="T('5')">5</button><button class="k" onclick="T('6')">6</button><button class="k" onclick="T('7')">7</button><button class="k" onclick="T('8')">8</button><button class="k" onclick="T('9')">9</button><button class="k" onclick="T('0')">0</button>
</div>
<div class="gap"></div>
<div class="row">
<button class="c c1" onclick="T('bho ')"></button><button class="c c2" onclick="T('cho ')"></button><button class="c c3" onclick="T('dho ')"></button><button class="c c4" onclick="T('pho ')"></button><button class="c c5" onclick="T('gho ')"></button><button class="c c6" onclick="T('jho ')"></button><button class="c c7" onclick="T('tho ')"></button><button class="c c8" onclick="T('ho ')"></button><button class="c c9" onclick="T('ro ')"></button><button class="ctrl" onclick="B()">×</button>
</div>
<div class="gap"></div>
<div class="row">
<button class="c c10" onclick="T('bro ')"></button><button class="c c11" onclick="T('cro ')"></button><button class="c c12" onclick="T('dro ')"></button><button class="c c13" onclick="T('pro ')"></button><button class="c c14" onclick="T('gro ')"></button><button class="c c15" onclick="T('jro ')"></button><button class="c c16" onclick="T('thro ')"></button><button class="c c17" onclick="T('hro ')"></button><button class="c c18" onclick="T('a ')"></button><button class="ctrl" onclick="D()">✓</button>
</div>
</div>
<script>
const S=document.getElementById("screen");
function T(x){S.value+=x}
function B(){S.value=S.value.slice(0,-1)}
function D(){S.value+=' '}
</script>
</body>
                                                    </html>
